<!doctype html>
<html>

<head>
  <title>MCMI 2026</title>  <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://use.fontawesome.com/releases/v5.2.0/css/all.css" media="screen" rel="stylesheet" type="text/css" />
  <link href="css/frame.css" media="screen" rel="stylesheet" type="text/css" />
  <link href="css/controls.css" media="screen" rel="stylesheet" type="text/css" />
  <link href="css/custom.css" media="screen" rel="stylesheet" type="text/css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/footer.js"></script>
  <link rel="icon" type="image/x-icon" href="/img/logo.ico">
  <style>
    .menu-about {
      color: var(--header-color) !important;
      opacity: 1 !important;
    }
  </style>
</head>

<body>
  <div class="menu-container"></div>
  <div class="content-container">
    <div class="banner" style="background: url('img/lyon.webp') no-repeat center; background-size: cover; height: 320px;">
      <div class="banner-table flex-column" style="background: linear-gradient(135deg, rgba(0, 74, 172, 0.92), rgba(26, 95, 189, 0.88), rgba(255, 49, 48, 0.85));">
        <div class="flex-row">
          <div class="flex-item flex-column">
            <h1 class="add-top-margin-small strokeme">
              MCMI 2026 - Organisation
            </h1>
          </div>
        </div>
      </div>
    </div>
    <div class="banner" id="organisation">
      <div class="banner-table flex-column">
        <div class="flex-row">
          <div class="flex-item flex-column">
            <h2 class="add-top-margin-small">Organisation Committee</h2>
          </div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="content-table flex-column">
        <div class="flex-row">
          <div class="flex-item flex-column full-width">
            <!-- --------------------------------------------------------- -->
            <h3>Chairs</h3>

            <div class="organizer-grid" id="chairs-grid"></div>
            <script>
              (function() {
                var grid = document.getElementById('chairs-grid');
                SITE_DATA.organizers.chairs.forEach(function(person) {
                  var tag = person.website ? 'a' : 'div';
                  var card = document.createElement(tag);
                  card.className = 'organizer-card';
                  if (person.website) {
                    card.href = person.website;
                    card.target = '_blank';
                  }
                  card.innerHTML =
                    '<img class="organizer-img" src="' + person.image + '" alt="' + person.name + '">' +
                    '<div class="organizer-name">' + person.name + '</div>' +
                    '<div class="organizer-affil">' + person.affiliation + '</div>';
                  grid.appendChild(card);
                });
              })();
            </script>
            
            <p class="text" style="margin-top: 20px;">Contact: <a href="mailto:mcmi@unikore.it">mcmi@unikore.it</a></p>

            <!-- --------------------------------------------------------- -->
            <h3>Local Organizers</h3>

            <div class="organizer-grid" id="local-organizers-grid"></div>
            <script>
              (function() {
                var grid = document.getElementById('local-organizers-grid');
                SITE_DATA.organizers.localOrganizers.forEach(function(person) {
                  var tag = person.website ? 'a' : 'div';
                  var card = document.createElement(tag);
                  card.className = 'organizer-card';
                  if (person.website) {
                    card.href = person.website;
                    card.target = '_blank';
                  }
                  card.innerHTML =
                    '<img class="organizer-img" src="' + person.image + '" alt="' + person.name + '">' +
                    '<div class="organizer-name">' + person.name + '</div>' +
                    '<div class="organizer-affil">' + person.affiliation + '</div>';
                  grid.appendChild(card);
                });
              })();
            </script>
            <!-- --------------------------------------------------------- -->
          </div>
        </div>
      </div>
    </div>

    <div class="banner" id="tpc">
      <div class="banner-table flex-column">
        <div class="flex-row">
          <div class="flex-item flex-column">
            <h2 class="add-top-margin-small">Program Committee</h2>
          </div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="content-table flex-column">
        <div class="flex-row">
          <div class="flex-item flex-column full-width">
            <!-- --------------------------------------------------------- -->
            <h3>Members</h3>
            
            <ul id="pc-list"></ul>
            <script>
              (function() {
                var list = document.getElementById('pc-list');
                SITE_DATA.programCommittee.forEach(function(m) {
                  var li = document.createElement('li');
                  li.innerHTML = '<b>' + m.name + '</b>, ' + m.affiliation;
                  list.appendChild(li);
                });
              })();
            </script>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-container"></div>
</body>

</html>
